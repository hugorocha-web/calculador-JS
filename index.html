<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <main>
        <input type="text" name="" id="text">
        <div id="conteinerbtn">
            <div>
                <button id="delet" class="botoes pri" data-valor="delete"><i
                        class="fa-solid fa-delete-left"></i></button>
                <button id="ac" class="botoes pri" data-valor="AC">AC</button>
                <button id="porcent" class="botoes pri" data-valor="%"><i class="fa-solid fa-percent"></i></button>
                <button id="divid" class="botoes lado" data-valor="/"><i class="fa-solid fa-divide"></i></button>
            </div>
            <div>
                <button id="i7" class="botoes" data-valor="7">7</button>
                <button id="i8" class="botoes" data-valor="8">8</button>
                <button id="i9" class="botoes" data-valor="9">9</button>
                <button id="x" class="botoes lado" data-valor="*"><i class="fa-solid fa-x"></i></button>
            </div>
            <div>
                <button id="i4" class="botoes" data-valor="4">4</button>
                <button id="i5" class="botoes" data-valor="5">5</button>
                <button id="i6" class="botoes" data-valor="6">6</button>
                <button id="menus" class="botoes lado" data-valor="-"><i class="fa-solid fa-minus"></i></button>
            </div>
            <div>
                <button id="i1" class="botoes" data-valor="1">1</button>
                <button id="i2" class="botoes" data-valor="2">2</button>
                <button id="i3" class="botoes" data-valor="3">3</button>
                <button id="mais" class="botoes lado" data-valor="+"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div>
                <button id="i0" class="botoes" data-valor="0">0</button>
                <button id="pont" class="botoes" data-valor=".">.</button>
                <button id="vir" class="botoes" data-valor=",">,</button>
                <button id="igual" class="botoes lado" data-valor="="><i class="fa-solid fa-equals"></i></button>
            </div>
        </div>


    </main>
    <script src="index.js"></script>
</body>

</html>
